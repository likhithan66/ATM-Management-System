<!DOCTYPE html>
<html>

<head>

    <title>ATM System</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="atm-container">

        <h1>ATM SYSTEM</h1>

        <h2>Welcome</h2>

        <p>Please select an option</p>


        <button
            class="withdraw-btn"
            onclick="goToWithdraw()"
        >
            Withdraw
        </button>


        <button
            class="deposit-btn"
            onclick="goToDeposit()"
        >
            Deposit
        </button>


        <button
            class="balance-btn"
            onclick="goToBalance()"
        >
            Check Balance
        </button>


        <button
            class="account-btn"
            onclick="goToAccount()"
        >
            Account Details
        </button>


        <button
            class="logout-btn"
            onclick="goHome()"
        >
            Logout
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
