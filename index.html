<!DOCTYPE html>
<html>

<head>

    <title>ATM Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="atm-container">

        <h1>ATM LOGIN</h1>

        <p>Enter your password</p>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <br>

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
